<svg viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Arquitetura Master Data Management de Materiais">
  <defs>
    <linearGradient id="mdm-hub" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e8c06a"/>
      <stop offset="1" stop-color="#b8891e"/>
    </linearGradient>
    <marker id="mdm-arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#d4a843"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="300" rx="22" fill="#101116"/>
  <rect x="0.5" y="0.5" width="959" height="299" rx="21.5" fill="none" stroke="#2a2a32"/>

  <text x="40" y="46" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#e8c06a" font-weight="600">Master Data Management de Materiais</text>
  <text x="40" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" fill="#8a8a94">Governança do ciclo de vida do cadastro de materiais</text>

  <!-- Node 1: SAP -->
  <rect x="40" y="120" width="185" height="92" rx="16" fill="#1a1a20" stroke="#3a3a44"/>
  <text x="132" y="156" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#f2f0ea" font-weight="700">SAP ECC</text>
  <text x="132" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9b9ba4">MARA · MARC · WBHI</text>
  <text x="132" y="193" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9b9ba4">T001W · T134T</text>

  <!-- Node 2: SAP Data Services -->
  <rect x="272" y="120" width="185" height="92" rx="16" fill="#1a1a20" stroke="#3a3a44"/>
  <text x="364" y="156" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#f2f0ea" font-weight="700">SAP Data Services</text>
  <text x="364" y="178" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#9b9ba4">Extração / CDC</text>

  <!-- Node 3: BigQuery (hub) -->
  <rect x="504" y="108" width="200" height="116" rx="18" fill="url(#mdm-hub)"/>
  <text x="604" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#221a06" font-weight="800">Google BigQuery</text>
  <text x="604" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3a2c08">Camada MDM governada</text>
  <text x="604" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#3a2c08">Classificação · regras de bloqueio</text>

  <!-- Node 4: Delivery -->
  <rect x="750" y="120" width="170" height="92" rx="16" fill="#1a1a20" stroke="#d4a843"/>
  <text x="835" y="152" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#e8c06a" font-weight="700">Power BI</text>
  <text x="835" y="174" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#c9b98a">Master Data · Bloqueios</text>
  <text x="835" y="190" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#c9b98a">Direct PO · Evolução da base</text>

  <!-- Arrows -->
  <line x1="225" y1="166" x2="270" y2="166" stroke="#d4a843" stroke-width="2.4" marker-end="url(#mdm-arrow)"/>
  <line x1="457" y1="166" x2="502" y2="166" stroke="#d4a843" stroke-width="2.4" marker-end="url(#mdm-arrow)"/>
  <line x1="704" y1="166" x2="748" y2="166" stroke="#d4a843" stroke-width="2.4" marker-end="url(#mdm-arrow)"/>

  <text x="40" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" fill="#6f6f78">SAP ECC → SAP Data Services → BigQuery (MDM) → Power BI</text>
</svg>